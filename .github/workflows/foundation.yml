name: Sprint 28.3 Full Regression Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-sprint28-3
          path: |
            playwright-report/
            test-results/
          retention-days: 7
